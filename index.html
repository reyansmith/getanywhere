<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse, read, and download lab programs and study materials.">
  <title>CS Lab Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/github-dark.min.css">
  <style>
    :root{color-scheme:light;--ink:#202b3c;--muted:#667386;--line:#e4e8ef;--blue:#315ee8;--bg:#f6f7f9;--card:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input{font:inherit}a{color:inherit}.wrap{width:min(1050px,calc(100% - 36px));margin:auto}
    header{background:white;border-bottom:1px solid var(--line)}.top{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;text-decoration:none}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;background:var(--blue);color:white;font-weight:700}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:12px}.total{color:var(--muted);font-size:13px}.total strong{color:var(--ink)}
    main{padding:46px 0 64px}h1{margin:0;font-size:30px;letter-spacing:-.7px}.lead{margin:7px 0 24px;color:var(--muted)}.toolbar{display:flex;align-items:center;gap:14px}.searchbox{flex:1}.searchbox input{width:100%;height:43px;padding:0 13px;border:1px solid #d8dee8;border-radius:7px;background:white;outline:none}.searchbox input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #315ee81c}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter,.btn{border:1px solid var(--line);border-radius:6px;padding:7px 11px;background:white;color:#58667a;text-decoration:none;cursor:pointer;font-size:13px;font-weight:600}.filter:hover,.btn:hover{border-color:#aab9e2;color:var(--blue)}.filter.active,.btn.primary{border-color:var(--blue);background:var(--blue);color:white}.summary{margin:22px 0 10px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{min-height:176px;padding:17px;border:1px solid var(--line);border-radius:8px;background:var(--card);display:flex;flex-direction:column}.cardtop{display:flex;justify-content:space-between;align-items:center;gap:8px}.lab{font-size:12px;font-weight:700;color:#56647a}.tag{font-size:11px;font-weight:700;color:#315ee8;background:#eef2ff;border-radius:4px;padding:3px 7px}.card h2{font-size:16px;line-height:1.35;margin:16px 0 5px}.card p{font-size:13px;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:8px;margin-top:auto}.empty{padding:42px 16px;border:1px dashed #cbd3df;border-radius:8px;background:white;text-align:center}.empty h2{margin:0 0 5px;font-size:18px}.empty p{margin:0 0 15px;color:var(--muted)}.hidden{display:none!important}
    footer{border-top:1px solid var(--line);background:white;padding:18px 0;color:var(--muted);font-size:13px}.foot{display:flex;justify-content:space-between}
    .modal{position:fixed;inset:0;z-index:10;background:#172033a8;display:flex;align-items:center;justify-content:center;padding:18px}.viewer{width:min(900px,100%);height:min(850px,92vh);background:white;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px #0003}.viewhead{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line)}.viewtitle{font-size:14px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.close{border:0;background:none;color:#687386;font-size:24px;cursor:pointer}.viewer iframe{border:0;flex:1;width:100%;background:#eef1f5}
    .reader-scroll{overflow:auto;padding:24px 24px 40px;background:white}.reader{width:min(720px,100%);margin:0 auto;color:#263244;font-size:15px;line-height:1.75;overflow-wrap:anywhere}.reader h1,.reader h2,.reader h3,.reader h4{line-height:1.3;margin:1.5em 0 .55em;color:#1d2939}.reader h1{font-size:28px}.reader h2{font-size:22px}.reader h3{font-size:18px}.reader p{margin:.8em 0}.reader ul,.reader ol{padding-left:1.6em}.reader li{padding-left:.2em;margin:.28em 0}.reader blockquote{margin:1em 0;padding:10px 15px;border-left:3px solid #e4a534;background:#fff9ea;color:#596273;border-radius:0 6px 6px 0}.reader table{border-collapse:collapse;width:100%;margin:1em 0;font-size:14px}.reader th,.reader td{border:1px solid #e0e5ec;padding:8px 10px;text-align:left}.reader th{background:#f5f7fa}.reader a{color:#315ee8}.reader :not(pre)>code{font: .9em ui-monospace,SFMono-Regular,Consolas,monospace;background:#f1f3f6;padding:2px 5px;border-radius:4px}.codebox{margin:1.15em 0;border:1px solid #dce2eb;border-radius:8px;overflow:hidden;background:#0d1117}.codehead{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 14px;background:#151b23;border-bottom:1px solid #28313b;color:#b7c0cc;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}.copycode{border:1px solid #394351;border-radius:5px;background:transparent;color:#d9e0ea;padding:4px 9px;cursor:pointer;font-size:11px}.copycode:hover{background:#26303d}.codebox pre{margin:0;padding:15px;overflow:auto;max-height:none}.codebox pre code{font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;white-space:pre;tab-size:4}.copied{color:#8ae0ad}.doc-error{margin:auto;color:#8a3840;text-align:center;padding:30px}.plain-text{white-space:pre-wrap;overflow-wrap:anywhere}
    @media(max-width:800px){.toolbar{align-items:stretch;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){.wrap{width:calc(100% - 26px)}main{padding:34px 0 48px}h1{font-size:25px}.grid{grid-template-columns:1fr}.top{height:66px}.brand small{font-size:11px}.total{font-size:12px}.foot{gap:8px;flex-direction:column}.modal{padding:0}.viewer{height:100vh;border-radius:0}.reader-scroll{padding:20px 16px 32px}}
    :root{color-scheme:dark;--ink:#e5e7eb;--muted:#9299a6;--line:#272b34;--blue:#8b9cff;--bg:#101114;--card:#15171b}
    body{background:var(--bg);color:var(--ink)}header,footer{background:#101114;border-color:#24262c}.mark{background:#313c68}.total strong{color:#dfe3ec}
    main{padding-top:40px;padding-bottom:56px}.lead,.summary,.brand small{color:#858c99}.searchbox input{background:#15171b;border-color:#2a2e37;color:#e5e7eb}.searchbox input::placeholder{color:#747c8a}.searchbox input:focus{border-color:#7387f2;box-shadow:0 0 0 2px #7387f222}
    .filter,.btn{background:#15171b;border-color:#292d36;color:#b2b8c3}.filter:hover,.btn:hover{border-color:#505b7b;color:#c0caff}.filter.active,.btn.primary{background:#333f70;border-color:#333f70;color:#eff1ff}.card{background:#15171b;border-color:#252830}.card h2{color:#e1e4e9}.card p{color:#9299a6}.lab{color:#a3aab6}.tag{background:#202638;color:#aebcff}.empty{background:#15171b;border-color:#343842}.empty p{color:#9299a6}
    .modal{background:#000a}.viewer{background:#15171b;box-shadow:0 20px 60px #0008}.viewhead{border-color:#292d36}.viewtitle{color:#e1e4e9}.close{color:#aab0bb}.viewer iframe{background:#111318}.reader-scroll{background:#15171b}.reader{color:#d1d5dc}.reader h1,.reader h2,.reader h3,.reader h4{color:#eef0f4}.reader blockquote{background:#211e17;color:#c5bda9;border-left-color:#be9343}.reader th,.reader td{border-color:#343842}.reader th{background:#20232a}.reader :not(pre)>code{background:#252932;color:#e0e4ed}.doc-error{color:#f39aa1}
    ::selection{background:#5369c266;color:#fff}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    main{padding-top:34px;padding-bottom:48px}h1{font-size:27px;letter-spacing:-.5px;margin-bottom:20px}.toolbar{gap:10px}.filter{border-radius:999px;padding:6px 11px}.grid{gap:11px}.card{min-height:164px;padding:16px;border-radius:10px;transition:border-color .15s,background .15s}.card:hover{border-color:#3a4050;background:#181a20}.card h2{margin-top:13px;font-size:15px}.card p{font-size:12.5px}.actions{gap:7px}.btn{padding:6px 10px;border-radius:6px}.total{padding:5px 9px;border:1px solid #292d36;border-radius:999px;font-size:12px}
  </style>
</head>
<body>
  <header><div class="wrap top"><a class="brand" href="#main"><span class="mark">CS</span><span><b>CS Lab Portal</b></span></a><span class="total"><strong id="document-count">0</strong> materials</span></div></header>
  <main class="wrap" id="main">
    <h1>Lab materials</h1>
    <div class="toolbar"><label class="searchbox"><input id="search" type="search" placeholder="Search by title, lab, or keyword" aria-label="Search materials"></label><div class="filters" id="filters" aria-label="Filter by subject"></div></div>
    <p id="summary" class="summary sr-only" aria-live="polite"></p><section id="grid" class="grid" aria-label="Study materials"></section>
    <section id="empty" class="empty hidden"><h2>No matching lab programs found</h2><p>Try a different search or subject.</p><button class="btn" id="clear" type="button">Clear filters</button></section>
  </main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="viewtitle"><div class="viewer"><div class="viewhead"><span id="viewtitle" class="viewtitle">Document preview</span><a id="open-tab" class="btn" target="_blank" rel="noopener">Open file</a><button id="close" class="close" type="button" aria-label="Close preview">×</button></div><iframe id="pdf-view" title="PDF preview" class="hidden"></iframe><div id="text-view" class="reader-scroll hidden"><article id="reader" class="reader"></article></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>
  <script>
    // Add a material by copying an object. Put its file beside index.html or in ./pdfs/.
    const documents = [
      { title: "AWT Example Programs", labNumber: "Examples", subject: "Web Technology", description: "JavaScript and HTML examples for moving elements on a web page.", filePath: "./awt-exampleprograms.txt" },
      { title: "AWT Lab 1", labNumber: "Lab 01", subject: "Web Technology", description: "Lab notes and example programs for the first AWT practical.", filePath: "./lab1-awt.txt" },
      { title: "AWT Part A Syllabus", labNumber: "Syllabus", subject: "Web Technology", description: "Part A syllabus and study material for AWT.", filePath: "./awt-parta-syllabus.txt" }
    ];
    const categories = ["All", ...new Set(documents.map(doc => doc.subject))];
    const grid = document.getElementById("grid"), search = document.getElementById("search"), filterBox = document.getElementById("filters");
    let active = "All";
    document.getElementById("document-count").textContent = documents.length;

    function renderFilters(){filterBox.replaceChildren();categories.forEach(name=>{const b=document.createElement("button");b.type="button";b.className="filter"+(active===name?" active":"");b.textContent=name;b.setAttribute("aria-pressed",String(active===name));b.onclick=()=>{active=name;renderFilters();renderCards()};filterBox.append(b)})}
    function renderCards(){const term=search.value.trim().toLowerCase();const found=documents.filter(d=>(active==="All"||d.subject===active)&&`${d.title} ${d.labNumber} ${d.subject} ${d.description}`.toLowerCase().includes(term));grid.replaceChildren(...found.map(d=>{const card=document.createElement("article");card.className="card";const head=document.createElement("div");head.className="cardtop";const lab=document.createElement("span");lab.className="lab";lab.textContent=d.labNumber;const tag=document.createElement("span");tag.className="tag";tag.textContent=d.subject;head.append(lab,tag);const title=document.createElement("h2");title.textContent=d.title;const desc=document.createElement("p");desc.textContent=d.description;const actions=document.createElement("div");actions.className="actions";const preview=document.createElement("button");preview.className="btn";preview.type="button";preview.textContent="Preview";preview.onclick=()=>openDocument(d);const download=document.createElement("a");download.className="btn primary";download.textContent="Download";download.href=d.filePath;download.setAttribute("download",d.filePath.split("/").pop());actions.append(preview,download);card.append(head,title,desc,actions);return card}));grid.classList.toggle("hidden",!found.length);document.getElementById("empty").classList.toggle("hidden",!!found.length);document.getElementById("summary").textContent=`${found.length} ${found.length===1?"material":"materials"}`}

    // Convert obvious legacy, unfenced HTML examples to Markdown fences. Prose is left as prose.
    function fenceUnmarkedHtml(source){return source.replace(/(^|\n)([ \t]*<!doctype\s+html[\s\S]*?<\/html\s*>)/gi,(all,prefix,block)=>`${prefix}\n\`\`\`html\n${block.trim()}\n\`\`\`\n`)}
    function langLabel(lang){const labels={js:"JavaScript",javascript:"JavaScript",html:"HTML",xml:"HTML",css:"CSS",c:"C",cpp:"C++",java:"Java",py:"Python",python:"Python",sql:"SQL",bash:"Bash",sh:"Shell",json:"JSON",text:"Text",txt:"Text"};return labels[(lang||"").toLowerCase()]||((lang||"").trim()||"Code")}
    function enhanceCodeBlocks(root){root.querySelectorAll("pre > code").forEach(code=>{const pre=code.parentElement;const raw=code.textContent;const lang=(code.className.match(/language-([\w+-]+)/)||[])[1]||"";let highlighted=code;
        if(window.hljs){if(lang&&hljs.getLanguage(lang))highlighted=hljs.highlight(raw,{language:lang,ignoreIllegals:true}).value;else highlighted=hljs.highlightAuto(raw).value;}
        const box=document.createElement("div");box.className="codebox";const bar=document.createElement("div");bar.className="codehead";const label=document.createElement("span");label.textContent=langLabel(lang||(window.hljs&&hljs.highlightAuto(raw).language)||"");const copy=document.createElement("button");copy.className="copycode";copy.type="button";copy.textContent="Copy";copy.onclick=async()=>{try{await navigator.clipboard.writeText(raw)}catch{const area=document.createElement("textarea");area.value=raw;document.body.append(area);area.select();document.execCommand("copy");area.remove()}copy.textContent="Copied!";copy.classList.add("copied");setTimeout(()=>{copy.textContent="Copy";copy.classList.remove("copied")},1400)};bar.append(label,copy);pre.className="hljs";pre.innerHTML=`<code>${highlighted}</code>`;box.append(bar,pre);pre.replaceWith(box)});
    }
    function renderText(source){const input=fenceUnmarkedHtml(source);let html;
      if(window.marked){marked.setOptions({gfm:true,breaks:false});html=marked.parse(input)}else{html=`<div class="plain-text">${input.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}</div>`}
      // If the sanitizer CDN is unavailable, show escaped source rather than inserting unsanitized HTML.
      const safe=window.DOMPurify?DOMPurify.sanitize(html,{USE_PROFILES:{html:true}}):`<div class="plain-text">${source.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}</div>`;
      const reader=document.getElementById("reader");reader.innerHTML=safe;enhanceCodeBlocks(reader);
    }
    const modal=document.getElementById("modal"),pdf=document.getElementById("pdf-view"),textView=document.getElementById("text-view");
    async function openDocument(doc){document.getElementById("viewtitle").textContent=doc.title;document.getElementById("open-tab").href=doc.filePath;modal.classList.remove("hidden");document.body.style.overflow="hidden";const isText=/\.txt$|\.md$/i.test(doc.filePath);pdf.classList.toggle("hidden",isText);textView.classList.toggle("hidden",!isText);
      if(isText){document.getElementById("reader").innerHTML="<p>Loading document…</p>";try{const response=await fetch(doc.filePath);if(!response.ok)throw new Error("Could not load this file");renderText(await response.text())}catch(error){document.getElementById("reader").innerHTML="";const message=document.createElement("p");message.className="doc-error";message.textContent="Could not load this text file. Open the portal through a local web server (not directly as a file) and check that the TXT file is beside index.html.";document.getElementById("reader").append(message)}}else{pdf.src=doc.filePath}}
    function closeModal(){modal.classList.add("hidden");pdf.src="about:blank";document.getElementById("reader").replaceChildren();document.body.style.overflow=""}
    document.getElementById("close").onclick=closeModal;modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.classList.contains("hidden"))closeModal()});search.addEventListener("input",renderCards);document.getElementById("clear").onclick=()=>{search.value="";active="All";renderFilters();renderCards();search.focus()};
    renderFilters();renderCards();
  </script>
</body>
</html>
